# Samsung EHS (NASA protocol) heat pump -> Home Assistant via ESPHome
# Tested on: Samsung EHS Mono ClimateHub AE260RNWSGG (9 kW, R-32, 254 L tank)
# Hardware:  M5Stack ATOM Lite (ESP32) + M5Stack ATOM Tail485 (RS485)
# Component: https://github.com/omerfaruk-aran/esphome_samsung_hvac_bus
# Entity ids in the HA package assume friendly_name "Heat Pump" (sensor.heat_pump_*).

esphome:
  name: samsung-ehs
  friendly_name: Heat Pump
  # Uncomment on low-RAM hosts (e.g. Home Assistant Yellow / Green): build with one job at a time.
  # compile_process_limit: 1

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

# Enable logging
logger:
  logs:
    component: ERROR # Remove the "Your component takes to long to respond warning"

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Samsung-EHS Fallback"
    password: !secret ap_password

captive_portal:

# Specify pins used by the board to comunicate with RS485 board - in this case M5STACK
uart:
  tx_pin: GPIO26   # Use GPIO26 for ATOM Tail485 / was GPIO19
  rx_pin: GPIO32   # Use GPIO32 for ATOM Tail485 / was GPIO22
  # For older devices it could also be 2400. But you should start with 9600.
  baud_rate: 9600
  parity: EVEN

## SAMSUNG AC CONFIGURATION

# Import custom component from GitHub
external_components:
  - source: github://omerfaruk-aran/esphome_samsung_hvac_bus@main # Use @stable if you want a more stable experience, but note a lot of this example code breaks.
    components: [samsung_ac]

# Configuration of AC component
samsung_ac:

  # non_nasa_keepalive: Prevents some Non-NASA units from sleeping when idle.
  # This increases bus traffic slightly; disable if you don't need idle telemetry.
  non_nasa_keepalive: true

  # Enable 'debug_log_messages_on_change' to log sensor data changes within 120 seconds
  # When set to true, this option logs the sensor data only when the value changes within a 120-second interval,
  # reducing redundant log messages and focusing on real-time data changes.
  debug_log_messages_on_change: true  # Enable log messages on change within 120 seconds

  # When enabled (set to true), this option will log the messages associated with undefined codes on the device. This is useful for debugging and identifying any unexpected or unknown codes that the device may receive during operation.
  debug_log_undefined_messages: true

  # When enabled (set to true), this option logs messages associated with defined codes on the device. This helps in monitoring the behavior of the device by recording the activity related to known, expected codes.
  debug_log_messages: true

  # For half duplex RS485 board with DI, DE, RE, and RO pins, you have to control read/write with control pin
  # see https://microcontrollerslab.com/rs485-serial-communication-esp32-esp8266-tutorial/ for wiring
  #flow_control_pin: GPIO4

  # Capabilities: Define which features your AC system supports.
  # - fan_modes is enabled by default (fan speed controls will be shown in HA)
  # - vertical_swing and horizontal_swing are disabled by default
  # You can set these globally here, or override per indoor unit under `devices:`
  capabilities:
    fan_modes: false
    vertical_swing: false
    horizontal_swing: false
    # Presets define special AC modes like Windfree, Eco, and so on.
    # The following modes are available: sleep, quiet, fast, longreach, windfree, eco.
    presets:
      # Short version - a quick and simple way to enable presets.
      quiet: false
      # Long version - allows customization, including localized names and control over enabling the presets.
      fast:
        name: "Fast cooling"
        enabled: false

  devices:
    - address: "20.00.00" # Indoor device address

      # DHW
      water_heater_power:
        name: "DHW Power"
        id: dhw_power
        on_turn_off:
          then:
            - if:
                condition:
                  lambda: "return id(climate_hot_water).mode > 0;"
                then:
                  - climate.control:
                      id: climate_hot_water
                      mode: "OFF"
        on_turn_on:
          then:
            - if:
                condition:
                  lambda: "return id(climate_hot_water).mode != 3;"
                then:
                  - climate.control:
                      id: climate_hot_water
                      mode: "HEAT"

      # Optional: show Samsung Auto as HA Heat/Cool (allows setting target temp in HA UI)
      map_auto_to_heat_cool: true

      # Configures/overrides the capabilites for this devices.
      # Look above for all options.
      capabilities:
        horizontal_swing: false # This device have no h swing.

      # Creates climate control in Home Assistant. A climate control combines multiple of the controls below (like temperature, mode etc.)
      climate:
        name: "Heat Pump climate"

      # The controls directly below are all included in the climate control. Its adviced to only add the climate control and skip the extra controls.
      room_temperature:
        name: "Heat Pump temperature"
      target_temperature:
        name: "Heat Pump target temperature"
      power:
        name: "Heat Pump power"
      mode:
        name: "Heat Pump mode"

      #Add automatic_cleaning mode for Samsung AC NASA
            #- Added the "automatic_cleaning" feature to the Samsung AC integration.
            #- This mode ensures hygienic drying of all moisture in the indoor unit after the cooling process is completed.
      automatic_cleaning:
        name: "Heat Pump automatic clean"

      # If your AC sits near or inside the ceiling, the reported room temperature is often a little bit heigher then whats
      # measured below. This property can be used to correct that value.
      room_temperature_offset: 0

      # EVA (Evaporator) temperatures - measures refrigerant temperatures at the indoor unit
      # These sensors help monitor system performance and diagnose issues
      # Supported on both NASA and Non-NASA devices
      indoor_eva_in_temperature:
        name: "Evaporator In temperature"
      indoor_eva_out_temperature:
        name: "Evaporator Out temperature"

      # Only supported on NASA devices
      room_humidity:
        name: "Heat Pump humidity"

      water_outlet_target:
        name: "Water Heater Target"

      custom_sensor:
        - name: "DHW Target Temperature"
          id: dhw_target
          message: 0x4235
          device_class: temperature
          state_class: measurement
          unit_of_measurement: C
          accuracy_decimals: 1
          filters:
            - multiply: 0.1
        - name: "DHW Current Temperature"
          id: dhw_temperature
          message: 0x4237
          device_class: temperature
          state_class: measurement
          unit_of_measurement: C
          accuracy_decimals: 1
          filters:
            - multiply: 0.1
        - name: "DHW Booster"
          id: dhw_booster
          message: 0x4087
        # Extra NASA messages: flow/return, 3-way valve, defrost, flow rate, heat output (for COP)
        - name: "Water Flow Temperature"
          id: water_flow_temp
          message: 0x4238
          device_class: temperature
          state_class: measurement
          unit_of_measurement: "°C"
          accuracy_decimals: 1
          filters:
            - multiply: 0.1
        - name: "Water Return Temperature"
          id: water_return_temp
          message: 0x4236
          device_class: temperature
          state_class: measurement
          unit_of_measurement: "°C"
          accuracy_decimals: 1
          filters:
            - multiply: 0.1
        - name: "3-Way Valve"
          id: three_way_valve
          message: 0x4067
          accuracy_decimals: 0
        - name: "Defrost State"
          id: defrost_state
          message: 0x402E
          accuracy_decimals: 0
        - name: "Water Flow Rate"
          id: water_flow_rate
          message: 0x42E9
          state_class: measurement
          unit_of_measurement: "L/min"
          accuracy_decimals: 1
          filters:
            - multiply: 0.1
        - name: "Heat Output Last Minute"   # W, average over the last minute
          id: heat_output_last_minute
          message: 0x4426
          device_class: power
          unit_of_measurement: "W"
          state_class: measurement
          accuracy_decimals: 0
        - name: "Heat Output Total"         # Wh, lifetime heat produced
          id: heat_output_total
          message: 0x4427
          device_class: energy
          unit_of_measurement: "Wh"
          state_class: total_increasing
          accuracy_decimals: 0

      water_temperature:
        name: "Warm water"
        id: hot_water_current_temp
      water_target_temperature:
        name: "DHW Target Temperature"
        id: hot_water_target_temp
        on_value:
          then:
            - logger.log:
                level: INFO
                format: "x: %f; DHW Target Temp ii: %f"
                args: ['x', 'id(climate_hot_water).target_temperature']
            - if:
                condition:
                  lambda: "return x != id(climate_hot_water).target_temperature;"
                then:
                  - climate.control:
                      id: climate_hot_water
                      target_temperature: !lambda "return x;"

      water_heater_mode:
        name: "Hotwater Mode"
        id: hotwater_mode

    - address: "10.00.00" # Outdoor device address as the following components are dependent on an outdoor unit.
      # This sensor captures and monitors specific error codes returned by the HVAC system.
      # When an error occurs, the sensor detects the error code and updates its value accordingly.
      # Additionally, by using the blueprint available at https://github.com/omerfaruk-aran/esphome_samsung_ac_blueprint,
      # you can automatically send detailed error messages to your mobile devices based on the captured error codes.
      error_code:
        name: error_code

       # Outdoor operation mode text sensor
      outdoor_operation_odu_mode:
        name: "ODU Mode"  # Displays the operational mode of the outdoor unit

      # Outdoor operation heat/cool mode text sensor
      outdoor_operation_heatcool:
        name: "ODU Heat-Cool"  # Displays whether the outdoor unit is in heating or cooling mode

      # This sensor measures the instantaneous power consumption of the outdoor unit in Watts.
      # The captured value represents the current power draw of the outdoor HVAC components, helping track energy usage patterns.
      outdoor_instantaneous_power:
        name: "Outdoor Instantaneous Power"

      # This sensor records the cumulative energy consumption of the outdoor unit in kWh.
      # It calculates the total energy consumed over time, allowing users to monitor and analyze energy efficiency.
      outdoor_cumulative_energy:
        name: "Outdoor Cumulative Energy"

      # This sensor measures the current drawn by the outdoor unit in Amperes.
      # Monitoring current values helps identify electrical irregularities and ensure safe power levels in the system.
      outdoor_current:
        name: "Outdoor Current"

      # This sensor tracks the voltage supplied to the outdoor unit in Volts.
      # Consistent voltage readings indicate stable power delivery, while deviations can help detect electrical issues in the system.
      outdoor_voltage:
        name: "Outdoor Voltage"

      # Only supported on NASA based heatpumps
      outdoor_temperature: # Should be used with outdoor device address
        name: "Outdoor temperature"

      custom_sensor:
        - name: "Compressor Frequency"
          id: compressor_frequency
          message: 0x8238
          state_class: measurement
          unit_of_measurement: "Hz"
          accuracy_decimals: 0

climate:

  # DHW Climate Control
  - platform: thermostat
    name: "Hot Water"
    id: climate_hot_water
    sensor: hot_water_current_temp
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_idle_time: 30s
    target_temperature_change_action:
      then:
        - logger.log:
            level: INFO
            format: "DHW Target Temp i: %f"
            args: ['id(climate_hot_water).target_temperature']
        - number.set:
            id: hot_water_target_temp
            value: !lambda "return id(climate_hot_water).target_temperature;"
    heat_action: {}
    idle_action: {}
    off_mode:
      then:
        - if:
            condition:
              switch.is_on: dhw_power
            then:
              switch.turn_off: dhw_power
    heat_mode:
      then:
        - if:
            condition:
              switch.is_off: dhw_power
            then:
              switch.turn_on: dhw_power
    default_preset: DAY
    preset:
      - name: NIGHT
        default_target_temperature_low: 40 °C
      - name: DAY
        default_target_temperature_low: 43 °C
      - name: AWAY
        default_target_temperature_low: 20 °C
      - name: DISINFECT
        default_target_temperature_low: 70 °C
    visual:
      min_temperature: 20
      max_temperature: 70
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
     